name: Run Concert Scraper

on:
  schedule:
    - cron: '0 4 */3 * *' # Läuft alle 3 Tage um 04:00 Uhr UTC
  workflow_dispatch: # Ermöglicht manuelle Starts im Actions-Tab

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scraper ausführen
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python scraper.py

      - name: Aktualisierte .ics-Datei ins Repo committen
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add combined_events.ics
          git commit -m "auto: update combined_events.ics" || exit 0
          git push
